[build]
  publish = "frontend"
  functions = "netlify/functions"
  command = "npm install && cd backend && npm install"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**"]

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

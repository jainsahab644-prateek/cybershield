<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Editor | CyberShield</title><link rel="stylesheet" href="../../css/styles.css?v=phase9"><link rel="stylesheet" href="../../css/admin.css?v=phase9"><link rel="stylesheet" href="../../css/learning.css?v=learning-refresh"><link rel="stylesheet" href="../../css/content-admin.css?v=learning-refresh"><script src="../../js/api.js?v=phase9" defer></script><script src="../../js/auth-api.js?v=phase9" defer></script><script src="../../js/markdown.js?v=phase9" defer></script><script src="../../js/admin/admin-api.js?v=phase9" defer></script><script src="../../js/admin/admin-ui.js?v=phase9" defer></script><script src="../../js/admin/admin-auth.js?v=phase9" defer></script><script src="../../js/admin/content-editor.js?v=learning-refresh" defer></script><script src="../../js/admin/editor-status-ui.js?v=phase9" defer></script></head><body class="admin-body"><a class="skip-link" href="#main-content">Skip to main content</a><main class="admin-main" id="main-content"><header class="admin-header"><div class="admin-header__inner"><div><p class="eyebrow eyebrow--light">Explicit save workflow</p><h1>Article Editor</h1><p>New articles remain drafts until separately published.</p></div><a class="button button--secondary" href="articles.html">Back to Articles</a></div></header><div class="admin-content"><p id="editor-live" class="admin-live" role="status" aria-live="polite"></p><div class="editor-grid"><section class="admin-panel"><form id="article-editor" class="content-form"><label>Title<input name="title" minlength="5" maxlength="180" required><span id="title-count" class="content-counter"></span></label><label>Summary<textarea name="summary" minlength="20" maxlength="500" required></textarea><span id="summary-count" class="content-counter"></span></label><label>Category<select name="categoryId" required><option value="">Select category</option></select></label><label>Cover illustration <span class="content-help">Only approved local CyberShield artwork can be selected.</span><select name="coverImage"><option value="">Automatic topic illustration</option><option value="phishing-awareness.webp">Phishing awareness</option><option value="payment-safety.webp">Payment safety</option><option value="social-media-safety.webp">Social media safety</option><option value="shopping-safety.webp">Shopping safety</option><option value="account-security.webp">Account security</option><option value="privacy-safety.webp">Privacy and personal data</option></select></label><label>Tags <span class="content-help">Comma-separated, for example phishing, email</span><input name="tags" maxlength="300"></label><label class="content-check"><input name="isFeatured" type="checkbox"><span>Feature this article when it is published</span></label><label>Content in controlled Markdown<textarea name="content" data-editor minlength="20" maxlength="30000" required aria-describedby="markdown-help"></textarea><span id="markdown-help" class="content-help">Supports headings, paragraphs, ordered/unordered lists, bold text, and safe links. Raw HTML is displayed as text.</span></label><button class="button button--primary" type="submit">Save Draft</button></form></section><aside class="admin-panel editor-preview"><div class="admin-panel__heading"><div><h2>Admin-only Preview</h2><p>Status: <strong id="editor-status">draft</strong></p></div></div><article><figure id="preview-cover-wrap" class="editor-cover-preview" hidden><img id="preview-cover" width="960" height="540" alt="Selected article cover preview"></figure><h2 id="preview-title">Untitled draft</h2><p id="preview-summary"></p><div id="preview-content" class="markdown-content"></div></article><div id="status-actions" class="content-actions" hidden><button id="publish-article" class="button button--primary" type="button">Publish Article</button><button id="archive-article" class="button button--secondary" type="button">Archive Article</button></div><p class="publish-confirm">Publishing requires a separate confirmation. Draft previews never use the public article API.</p></aside></div></div></main></body></html>

services:
  - type: web
    name: cybershield-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        value: https://cybersheildgov.netlify.app
      - key: SESSION_SECRET
        generateValue: true
      - key: IDENTIFIER_HASH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEV_OTP
        value: "123456"
